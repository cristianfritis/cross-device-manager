services:
  unit:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["ctest", "--test-dir", "build/linux-debug", "--output-on-failure"]
  # Packaging image (packaging-deb spec): same Dockerfile on ubuntu:22.04 —
  # release artifacts MUST be built on the oldest supported series so their
  # glibc/libstdc++ requirements and shlibdeps Depends install on 22.04 AND
  # 24.04 (t64 Provides cover the renamed Qt packages on amd64).
  pkg:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BASE: "ubuntu:22.04"
    command: ["bash"]
  # Fedora packaging image (packaging-rpm spec): builds the full stack, cuts the
  # rpm with `cpack -G RPM`, installs it with dnf, and `rpm -V`-verifies it — the
  # container gate analogous to the deb's VM install-smoke. Runs test/container/
  # rpm-verify.sh by default (Dockerfile.fedora CMD).
  pkg-rpm:
    build:
      context: ..
      dockerfile: Dockerfile.fedora
  # Design verification (design-verification spec): drives the real devmgr-gui
  # through its accessibility tree and the real devmgr-tui through fixed-size
  # tmux panes, and asserts what a user would actually see. This is the tier
  # above the offscreen/fixed-screen tests -- those cannot fail on a truncated
  # legend or a note missing from one surface, because they never render a real
  # terminal or a real window.
  #
  # NOTE: like every service here, this has NO volume mount. The image carries a
  # copy of the source, so a source change needs `docker compose build design`
  # before the run reflects it -- otherwise the harness reports on the previous
  # build.
  design:
    build:
      context: ..
      dockerfile: test/design/Dockerfile.design
    command: ["bash", "/src/test/design/run.sh"]
