<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for the design-verification harness ONLY. It lets the
  in-container fwupd double own org.freedesktop.fwupd on the private system bus
  the harness starts. It is copied into the container at run time and is never
  part of any shipped package.
-->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.fwupd"/>
    <allow send_destination="org.freedesktop.fwupd"/>
    <allow receive_sender="org.freedesktop.fwupd"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.fwupd"/>
    <allow receive_sender="org.freedesktop.fwupd"/>
  </policy>
</busconfig>
