name: ci
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          # Pinned to 18: unversioned `clang-format` floats with the runner image, and
          # versions disagree on trailing-comment alignment and `T x{}` spacing — a
          # runner bump would fail this gate with no source change. 18 matches the
          # container toolchain (Dockerfile, ubuntu:24.04).
          sudo apt-get update && sudo apt-get install -y clang-format-18
          find core tests app platform tui gui daemon cli -name '*.hpp' -o -name '*.cpp' | xargs clang-format-18 --dry-run --Werror
      - name: Toolkit purity guard (no Qt in core/app/platform/daemon/cli)
        # The Phase 3 seam test as a hard gate: the shared layers and the
        # UI-free recovery CLI must stay toolkit-agnostic. `!` inverts grep —
        # finding any match fails the job.
        run: |
          ! grep -rn --include='*.hpp' --include='*.cpp' -E '#include\s*[<"]Q[A-Za-z]' core app platform daemon cli
      - name: sdbus purity guard (sdbus-c++ only in daemon/ + the channel leaf)
        # The Phase 4 quarantine: sdbus types must never leak into the shared
        # layers. Allowed: daemon/src/*, the one client leaf file, and the
        # Phase 6 frontend-direct fwupd client (fwupd-named, DEVMGR_WITH_SDBUS
        # gated) — the parse layer's public API exposes sdbus::Variant by design.
        # The fwupd exemption is anchored to platform/ and tests/ ONLY: a
        # fwupd-named file under core/app/gui/tui must still trip the guard.
        run: |
          ! grep -rn --include='*.hpp' --include='*.cpp' -E '#include\s*[<"]sdbus' \
              core app gui tui tests platform cli \
              | grep -vE '^(platform/linux/src/dbus_privileged_channel\.cpp|(platform|tests)/.*fwupd.*\.(cpp|hpp)):'
      - name: Build and unit-test (Docker)
        run: docker compose -f test/docker-compose.yml run --rm unit
      - name: CLI inventory gate (no privileged helper present)
        # `devices list` reads through the device enumerator directly: no
        # daemon, no D-Bus, no polkit. The container runs no devmgrd, so this
        # is exactly that condition. Gated on LINUX as well as Windows on
        # purpose — the property is "needs no helper", not "needs no helper on
        # the platform that hasn't got one", and Linux is where a regression
        # would be introduced.
        run: |
          docker compose -f test/docker-compose.yml run --rm unit bash -c \
            "build/linux-debug/cli/devmgr devices list > /dev/null \
             && build/linux-debug/cli/devmgr devices show --json \
                  \$(build/linux-debug/cli/devmgr devices list --json | grep -m1 '\"id\"' \
                     | sed 's/.*: *\"//; s/\".*//') > /dev/null"
      - name: Static analysis (clang-tidy)
        # Reuses the image built above (toolchain + deps + compile_commands.json baked in).
        # Hard gate: any clang-tidy diagnostic in core/src fails the build.
        run: docker compose -f test/docker-compose.yml run --rm unit bash -c "clang-tidy -p build/linux-debug --warnings-as-errors='*' core/src/*.cpp app/src/*.cpp platform/linux/src/*.cpp gui/src/*.cpp daemon/src/*.cpp cli/src/*.cpp tui/src/*.cpp tui/src/views/*.cpp"

  # Design verification (design-verification spec): drives the REAL devmgr-gui
  # and devmgr-tui and asserts what a user would actually see -- cross-surface
  # parity on rendered text, legend shortcuts surviving every terminal width,
  # accessible names, and off-tab verbs being hidden rather than merely
  # disabled.
  #
  # NON-BLOCKING ON PURPOSE (cua-design-sandbox D8). A UI probe is a flakiness
  # source, and it must not wedge unrelated merges before it has a record.
  # Making it blocking is a later, deliberate decision with green runs behind
  # it -- not something that happens by leaving this line out.
  design-verification:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build the unit image the design image layers on
        run: docker compose -f test/docker-compose.yml build unit
      - name: Design verification sweep
        run: |
          mkdir -p "$PWD/design-artifacts"
          docker compose -f test/docker-compose.yml build design
          docker compose -f test/docker-compose.yml run --rm \
            -v "$PWD/design-artifacts:/out" design
      - name: Upload captured surfaces
        # A failure has to be diagnosable without reproducing it locally: the
        # a11y trees, the captured panes and the screenshots are the evidence.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-verification-surfaces
          path: design-artifacts/
          if-no-files-found: warn

  # Windows: COMPILATION AND UNIT TESTS ONLY. A hosted runner sees a synthetic
  # device set with no physical USB and no hotplug, so a green job here says the
  # Windows backend builds and its logic is correct — never that it works on a
  # real machine. Behavioural truth comes from the owner-gated manual smoke
  # (acceptance-suite spec).
  windows-build-and-test:
    # PINNED, and for the same reason Qt below is pinned (D12): the runner image
    # is a build input, and `windows-latest` is a label that moves under the
    # build without the build declaring anything. It moved on 2026-06-08, when
    # `windows-latest` and `windows-2025` both became Windows Server 2025 with
    # Visual Studio 2026 (v18); the `windows-debug` preset asks for the
    # `Visual Studio 17 2022` generator, so configure failed with "could not
    # find any instance of Visual Studio" — after vcpkg had already resolved
    # every pinned package, which is what an undeclared input looks like when it
    # breaks. `windows-2022` is the image GitHub names as the VS 2022 fallback.
    #
    # It is also the image that AGREES WITH THE ACCEPTANCE MACHINE, which runs
    # VS 2022 BuildTools. CI proving a toolchain the owner never exercises is
    # the same defect the Qt pin was moved to fix, pointed at the compiler.
    # Moving to VS 2026 is a real decision — MSBuild, the MSVC toolchain, the
    # .NET SDK and the Windows SDK headers all change together — and it belongs
    # in its own change, made on both sides at once, not in a label that drifts.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Provision Qt (pinned)
        # D12: CI OWNS Qt provisioning. Windows has no system Qt — no
        # distribution, no system package, every developer's install an
        # independently chosen version at an arbitrary path — so "use what is
        # installed" would make the build depend on an undeclared local
        # artifact, which is the opposite of what the Linux system-Qt rule
        # protects. The version below is the definition of what this build
        # depends on. Nothing here reads a pre-existing local Qt, and no task or
        # document resolves the Qt version by inspecting one; the owner's
        # machine is the ACCEPTANCE GATE, never the source.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Provision vcpkg (pinned commit)
        # Pinned to a commit, not to whatever the runner image ships: the
        # package versions this build resolves are a declared input
        # (docs/REPRODUCIBILITY.md), not ambient machine state.
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: a34a3811fce990f9d2809cf0356dd443143c7000
          runVcpkgInstall: false
      - name: Configure
        # DEVMGR_BUILD_GUI is forced ON rather than auto-detected: if the Qt
        # provisioning above ever stops working, this job must FAIL rather than
        # quietly stop covering the GUI.
        run: cmake --preset windows-debug -DDEVMGR_BUILD_GUI=ON
      - name: Build (core, app, platform/windows, gui, cli)
        run: cmake --build --preset windows-debug
      - name: Unit tests
        run: ctest --test-dir build/windows-debug -C Debug --output-on-failure
      - name: CLI inventory gate (no privileged helper present)
        # The Windows half of the same gate the Linux job runs: inventory verbs
        # need no daemon, no privileged channel and no elevation — which is the
        # whole reason the CLI is not gated on an operating system.
        run: build\windows-debug\cli\Debug\devmgr.exe devices list
